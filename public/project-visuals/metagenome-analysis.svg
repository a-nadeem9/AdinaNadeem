    <path d="M70 175v145"/>
  </g>
  <g stroke="#111111" stroke-width="2" fill="#ffffff">
    <rect x="515" y="176" width="120" height="42"/>
    <rect x="515" y="246" width="120" height="42"/>
    <path d="M575 222v20"/>
  </g>
  <g fill="#111111" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="700">
